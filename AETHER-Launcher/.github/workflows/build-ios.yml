name: Build iOS IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen
          python3 -m pip install --quiet --break-system-packages pyyaml || python3 -m pip install --quiet pyyaml

      - name: Preflight checks
        run: python3 Scripts/preflight.py

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build and package IPA
        run: ./Scripts/build_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AETHERLauncher-unsigned-ipa
          path: build/AETHERLauncher-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
